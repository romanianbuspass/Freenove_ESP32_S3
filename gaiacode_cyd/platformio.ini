; GaiaCode CYD — Freenove FNK0104N (ESP32-S3R8, 3.5" ST77922 QSPI 320x480)
; Board: 16 MB flash, 8 MB octal PSRAM, USB-CDC on boot.
; (esp32-s3-devkitc-1 base + explicit 16MB/octal-PSRAM overrides — the
;  N16R8 board ID is not present in espressif32@6.7.0.)

[env:fnk0104n]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200
upload_speed = 460800

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D LV_CONF_INCLUDE_SIMPLE
    -I include

lib_deps =
    lvgl/lvgl@8.4.0
    bblanchon/ArduinoJson@6.21.5
